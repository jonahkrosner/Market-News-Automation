name: Morning market brief
on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the brief to the configured iCloud address
        type: boolean
        default: true
  schedule:
    - cron: '0 7 * * *'
      timezone: America/New_York
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python morning_brief.py
      - name: Email morning brief
        if: github.event_name == 'schedule' || inputs.send_email
        run: python email_reports.py morning
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-market-brief
          path: morning_brief.md
