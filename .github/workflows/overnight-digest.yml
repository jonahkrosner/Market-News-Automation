name: Overnight market digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,12 * * *'
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check New York local schedule hour
        id: localtime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "7" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.localtime.outputs.run == 'true'
        run: python overnight_digest.py
      - if: steps.localtime.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: overnight-digest
          path: |
            overnight_digest.md
            overnight_digest.json
      - name: Email overnight report
        if: steps.localtime.outputs.run == 'true'
        run: python email_reports.py overnight
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_RECIPIENT: ${{ vars.EMAIL_RECIPIENT }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
