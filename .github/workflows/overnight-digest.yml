name: Overnight market digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,12 * * *'
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check New York local schedule hour
        id: localtime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "7" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.localtime.outputs.run == 'true'
        run: python overnight_digest.py
      - if: steps.localtime.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: overnight-digest
          path: |
            overnight_digest.md
            overnight_digest.json
