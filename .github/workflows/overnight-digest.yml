name: Overnight market digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: America/New_York
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python overnight_digest.py
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-digest
          path: |
            overnight_digest.md
            overnight_digest.json
