name: Economic surprise tracker
on:
  workflow_dispatch:
  schedule:
    - cron: '45 14,15 * * 1-5'
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check New York local schedule hour
        id: localtime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "10" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.localtime.outputs.run == 'true'
        run: python tracker.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.localtime.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: economic-surprises
          path: |
            surprise_log.json
            daily_brief.txt
            impact_rankings.csv
