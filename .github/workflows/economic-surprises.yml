name: Economic news
on:
  workflow_dispatch:
  schedule:
    - cron: '45 14,15 * * 1-5'
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python event_calendar.py
      - name: Check New York local schedule hour
        id: localtime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "10" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.localtime.outputs.run == 'true'
        run: python tracker.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.localtime.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: economic-news
          path: |
            surprise_log.json
            daily_brief.txt
            impact_rankings.csv
            upcoming_calendar.md
      - name: Email economic report
        if: steps.localtime.outputs.run == 'true'
        run: python email_reports.py economic
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
